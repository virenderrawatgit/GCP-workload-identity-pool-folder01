name: GCP Federation Test
on: [push]

permissions:
  contents: 'read'
  id-token: 'write' # REQUIRED for Federation

jobs:
  test-gcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: 'auth'
        name: 'Authenticate to GCP'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: 'projects/837215899692/locations/global/workloadIdentityPools/git-hub-pool-gcp/providers/github-provider'
          service_account: 'git-hub-sa@gcp-aug8.iam.gserviceaccount.com'

      - name: 'List of VM'
        run: gcloud compute instances list
